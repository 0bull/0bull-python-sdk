[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "0bull"
version = "0.1.0"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "websockets>=13,<16"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/zerobull"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--cov=zerobull --cov-branch --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
