[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "0bull"
dynamic = ["version"]
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{ name = "0bull" }]
keywords = ["0bull", "sdk", "api-client", "phone-automation", "video", "websocket"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "websockets>=13,<16"]

[project.urls]
Homepage = "https://0bull.net"
Documentation = "https://docs.0bull.net"
Source = "https://github.com/0bull/0bull-python-sdk"
Changelog = "https://github.com/0bull/0bull-python-sdk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[tool.hatch.version]
path = "src/zerobull/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zerobull"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "examples"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--cov=zerobull --cov-branch --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
